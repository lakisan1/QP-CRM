<!DOCTYPE html>
<html lang="{{ current_lang|default('en') }}" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ _('Login') }} - QP-CRM</title>
    <link rel="icon" type="image/png" href="/app_assets/favicon.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .login-sub {
            text-align: center;
            color: var(--muted, #888);
            margin: 0 0 24px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="card login-card">
        <h1 style="text-align: center; margin-bottom: 8px; font-size: 1.6rem;">QP-CRM</h1>
        <p class="login-sub">{{ _('One login for all modules') }}</p>

        {% if error %}
        <div class="alert alert-error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <p>
                <label for="username">{{ _('Username') }}</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username">
            </p>
            <p>
                <label for="password">{{ _('Password') }}</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </p>

            <button type="submit" class="btn btn-primary" style="width: 100%;">{{ _('Log in') }}</button>
            <a href="/" class="btn btn-secondary" style="width: 100%; margin-top: 10px;">{{ _('Home') }}</a>
        </form>
    </div>
</body>

</html>
