<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Promena lozinke - QP-CRM</title>
    <link rel="icon" type="image/png" href="/app_assets/favicon.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
    </style>
</head>

<body>
    <div class="card login-card">
        <h2 style="text-align: center; margin-bottom: 8px;">Promena lozinke</h2>

        {% if must_change_password %}
        <div class="alert alert-warning">
            Morate promeniti lozinku pre nego što nastavite. (Account
            {{ username }}: initial password must be changed on first login.)
        </div>
        {% endif %}

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.change_password') }}">
            <label>Trenutna lozinka</label>
            <input type="password" name="current_password" required autofocus
                   autocomplete="current-password">

            <label>Nova lozinka (min. 8 znakova)</label>
            <input type="password" name="new_password" required minlength="8"
                   autocomplete="new-password">

            <label>Potvrdi novu lozinku</label>
            <input type="password" name="confirm_password" required minlength="8"
                   autocomplete="new-password">

            <button type="submit" class="btn btn-primary" style="width: 100%;">Sačuvaj</button>
            <a href="{{ url_for('auth.logout') }}" class="btn btn-secondary"
               style="width: 100%; margin-top: 10px;">Odjavi se</a>
        </form>
    </div>
</body>

</html>
