{% extends "deals/base.html" %}
{% block title %}Novi posao{% endblock %}

{% block content %}
<h1>Novi posao</h1>

{% if error %}
<div class="alert alert-error" style="background: #e74c3c; color: white; padding: 10px; border-radius: 4px; margin-bottom: 20px;">
    {{ error }}
</div>
{% endif %}

<div class="card" style="max-width: 640px;">
    {# Discipline guard (open question #7): this form must stay < 30 s --
       pick a customer, one-line title, optional site, done. #}
    <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <p>
            <label>Kupac:<br>
                <select name="customer" id="deal-customer" required class="long-input">
                    <option value="">-- izaberite kupca --</option>
                    {% for c in customers %}
                    <option value="{{ c.id }}" {% if selected_customer == c.id %}selected{% endif %}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </label>
        </p>
        <p>
            <label>Naslov posla (jedan red):<br>
                <input type="text" name="title" required class="long-input" placeholder="npr. Dvostubni lift + PTI traka">
            </label>
        </p>
        <p>
            <label>Lokacija (opciono — prazno = glavna adresa):<br>
                <select name="location" id="deal-location" class="long-input">
                    <option value="">-- glavna adresa --</option>
                    {% for l in locations %}
                    <option value="{{ l.id }}">{{ l.name }}{% if l.address %} — {{ l.address }}{% endif %}</option>
                    {% endfor %}
                </select>
            </label>
        </p>
        <div class="form-actions" style="display: flex; gap: 15px; border-top: 1px solid var(--border-color); padding-top: 20px;">
            <button type="submit" class="btn btn-success">Otvori posao</button>
            <a href="{{ url_for('deals.list_deals') }}" class="btn btn-secondary">Nazad</a>
        </div>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Site picker: reload with ?customer= to pre-fill the location list
        var customerSelect = document.getElementById('deal-customer');
        customerSelect.addEventListener('change', function () {
            if (this.value) {
                window.location.href = {{ url_for('deals.new_deal') }} + '?customer=' + this.value;
            }
        });
    });
</script>
{% endblock %}
