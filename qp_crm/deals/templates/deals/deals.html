{% extends "deals/base.html" %}
{% block title %}Poslovi{% endblock %}

{% block content %}
<h1>Poslovi</h1>

<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <p style="margin: 0;"><a href="{{ url_for('deals.new_deal') }}" class="btn btn-success">Novi posao</a></p>
    <a href="{{ url_for('deals.list_deals', clear=1) }}" class="btn btn-secondary">Reset pretrage</a>
</div>

<div class="card">
    <form method="get" action="{{ url_for('deals.list_deals') }}" style="display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end;">
        <label style="display: flex; flex-direction: column;">
            <span style="font-size: 14px;">Status:</span>
            <select name="status" class="searchable-select" onchange="this.form.submit()">
                <option value="">-- svi statusi --</option>
                {% for key, value in status_labels.items() %}
                <option value="{{ key }}" {% if status == key %}selected{% endif %}>{{ value[0] }}</option>
                {% endfor %}
            </select>
        </label>
        <label style="display: flex; flex-direction: column;">
            <span style="font-size: 14px;">Kupac:</span>
            <select name="customer" class="searchable-select" onchange="this.form.submit()">
                <option value="">-- svi kupci --</option>
                {% for c in customers %}
                <option value="{{ c.id }}" {% if customer_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </label>
        <label style="display: flex; flex-direction: column;">
            <span style="font-size: 14px;">Pretraga (kod, naslov, kupac):</span>
            <input type="text" name="search" value="{{ search or '' }}" onchange="this.form.submit()">
        </label>
    </form>
</div>

<div class="card">
    {% include 'deals/_deal_table.html' %}
</div>
{% endblock %}
