<!doctype html>
<html lang="{{ current_lang|default('en') }}" data-theme="{{ theme|default('dark') }}">

<head>
    <meta charset="utf-8">
    <title>{% block title %}Cene{% endblock %}</title>
    <link rel="icon" type="image/png" href="/app_assets/favicon.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <!-- Tom Select (searchable dropdowns) -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
</head>

<body>
    {% from '_banner.html' import banner with context %}
    {% call banner() %}
        <a href="{{ url_for('sale.list_sale') }}" {% if request.endpoint=='sale.list_sale' %}class="active" {% endif %}>{{ _('PriceList') }}</a>
    {% endcall %}

    {% block content %}{% endblock %}

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Initialize Tom Select on elements with .searchable-select class
            document.querySelectorAll('.searchable-select').forEach((el) => {
                new TomSelect(el, {
                    create: false,
                    sortField: {
                        field: "text",
                        direction: "asc"
                    }
                });
            });
        });
    </script>
</body>

</html>
