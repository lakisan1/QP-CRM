# Auto-update via Watchtower — OPTIONAL compose override.
#
# Copy this file as `docker-compose.override.yml` (NEXT TO the main
# docker-compose.yml) and run `docker compose up -d` — Compose loads it
# automatically and merges it with the main stack. Watchtower then checks
# ghcr.io/lakisan1/qp-crm:latest once a day (04:00) and, if CI pushed a
# newer image, pulls it and recreates the qp-crm container. Data (bind
# mounts) stays untouched.
#
# Deliberately in a separate file (not the main compose): auto-update is the
# operator's choice, not the stack's default behavior. If you don't want it,
# simply don't copy the file; manual updating stays ./deploy.sh (see
# UPDATE.md).
#
# IMPORTANT: the image is pushed ONLY by CI that previously passed the whole
# test suite (.github/workflows/ci.yml), so "the newest image" always means
# "the newest TESTED image".

services:
  app:
    # Watchtower updates ONLY containers carrying this label.
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      # Watchtower talks to the Docker API to pull/replace the container.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # cron: every day at 04:00 (sec min hour ...). Alternatives: @hourly, @daily.
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      # after a successful update, remove the old image (disk hygiene)
      - WATCHTOWER_CLEANUP=true
      # watch ONLY labeled containers — never touches the rest of the Docker host
      - WATCHTOWER_LABEL_ENABLE=true
      # no notifications (configure if you want: WATCHTOWER_NOTIFICATIONS)
      - WATCHTOWER_NOTIFICATIONS=
