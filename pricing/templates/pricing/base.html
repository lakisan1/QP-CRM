<!doctype html>
<html lang="en" data-theme="{{ theme|default('dark') }}">

<head>
    <meta charset="utf-8">
    <title>{% block title %}Pricing App{% endblock %}</title>
    <link rel="icon" type="image/png" href="/app_assets/favicon.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <!-- Tom Select (searchable dropdowns) -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
</head>

<body>
    <nav>
        <div class="nav-links">
            <a href="{{ url_for('pricing.list_products') }}" {% if request.endpoint=='pricing.list_products' %}class="active" {% endif
                %}>{{ _('Product List') }}</a>
            <a href="{{ url_for('pricing.category_defaults') }}" {% if request.endpoint=='pricing.category_defaults' %}class="active" {%
                endif %}>{{ _('Categories') }}</a>
            <a href="{{ url_for('pricing.brands') }}" {% if request.endpoint=='pricing.brands' %}class="active" {% endif %}>{{
                _('Brands') }}</a>
            <a href="{{ url_for('pricing.quick_update_products') }}"
                class="{% if request.endpoint=='pricing.quick_update_products' %}active{% endif %}">{{ _('Quick
                Update') }}</a>
            <a href="{{ url_for('pricing.product_sync') }}" {% if request.endpoint=='pricing.product_sync' %}class="active" {%
                endif %}>{{ _('Sync Sajt') }}</a>
        </div>
        <div class="nav-right">

            <a href="/" {% if request.endpoint=='index' and not request.path.startswith('/pricing') %}class="active" {%
                endif %}>{{ _('Landing Page') }}</a>
            <a href="{{ url_for('pricing.logout') }}" class="btn btn-danger" style="margin-right: 15px;">Logout</a>
            <div class="nav-logo-container">
                <img src="{{ url_for('static', filename='img/logo_company.jpg') }}" alt="QP-CRM Logo" class="nav-logo">
            </div>
        </div>
    </nav>
    <hr>
    {% block content %}{% endblock %}

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Initialize Tom Select on elements with .searchable-select class
            // Store instance on the element so pages can destroy/re-init it later
            document.querySelectorAll('.searchable-select').forEach((el) => {
                el._tomSelect = new TomSelect(el, {
                    create: false,
                    sortField: {
                        field: "text",
                        direction: "asc"
                    }
                });
            });
        });
    </script>
</body>

</html>
