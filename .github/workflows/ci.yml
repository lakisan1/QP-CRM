# QP-CRM CI (Phase 2 stage 7): run the pytest suite in the same Docker image
# the deployment uses, exactly like the local gate:
#   docker compose build app && docker compose run --rm app pytest
#
# Two pytest steps:
#   1. "Run pytest suite" — the plain full suite (the canonical one-command
#      run; PytestConfigWarning-free — see the cache_dir note in pytest.ini).
#   2. "Coverage gate (money-path services)" — the SAME suite measured with
#      pytest-cov over ONLY the three service modules that own the money math
#      (qp_crm.services.offer_service / pricing_service / rent_service; the
#      module list lives in the repo-root .coveragerc [run] source). Fails the
#      build when their combined statement coverage drops below
#      --cov-fail-under=95. Threshold derivation is in .coveragerc: full-suite
#      measurement was 100% / 96% / 100% (99% total — pricing_service has one
#      unreachable legacy clamp line), rounded down to the nearest 5 so the
#      gate trips only on real regression.
#      Coverage data lands in /tmp/.coverage (.coveragerc [run] data_file)
#      because /app is root-owned read-only for the image's appuser.
#
# The compose file requires .env (env_file is mandatory); CI generates a
# throwaway .env with random secrets — tests run against a throwaway fixture
# DB in /tmp inside the container, never real data, and the values only sign
# sessions during the test run.
#
# Update system (pull-deploy): after pytest passes, the "image" job pushes
# the exact image the tests just ran in to GHCR (ghcr.io/lakisan1/qp-crm)
# with two tags: `latest` and the git SHA. A remote instance then updates
# with deploy.sh: pre-deploy backup + `docker compose pull` + `up -d` —
# no build on the server. SHA tags are what rollback.sh redeploys, so a
# rollback returns to the precise tested build, never a rebuilt one.
# PR runs skip the push (packages: write is only granted on push to main).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate throwaway .env (test-only secrets)
        run: |
          python3 - <<'EOF'
          import secrets
          keys = ["PRICING_SECRET_KEY", "OFFER_SECRET_KEY", "RENT_SECRET_KEY",
                  "ADMIN_SECRET_KEY", "SALE_SECRET_KEY", "SETTINGS_SECRET_KEY"]
          with open(".env", "w") as f:
              for k in keys:
                  f.write(f"{k}={secrets.token_hex(32)}\n")
          EOF

      - name: Build image
        run: docker compose build app

      - name: Run pytest suite
        run: docker compose run --rm app pytest

      # Money-path coverage gate — separate step so the plain suite above
      # stays the canonical one-command run (no --cov overhead for it).
      - name: Coverage gate (money-path services)
        run: docker compose run --rm app pytest --cov --cov-fail-under=95 --cov-report=term-missing

  image:
    # Push the tested image to GHCR — deploy.sh on the remote pulls this
    # instead of building. Skipped on PRs (GITHUB_TOKEN has no packages:
    # write there, so the push would fail; also untested code must not ship).
    needs: pytest
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate throwaway .env (compose build needs env_file)
        run: |
          python3 - <<'EOF'
          import secrets
          keys = ["PRICING_SECRET_KEY", "OFFER_SECRET_KEY", "RENT_SECRET_KEY",
                  "ADMIN_SECRET_KEY", "SALE_SECRET_KEY", "SETTINGS_SECRET_KEY"]
          with open(".env", "w") as f:
              for k in keys:
                  f.write(f"{k}={secrets.token_hex(32)}\n")
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build the pytest job ran (same commit) — re-tagged and pushed
      # with `latest` (what deploy.sh pulls) and the SHA (what rollback.sh
      # pins). The SHA tag is the permanent, immutable undo point.
      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lakisan1/qp-crm:latest
            ghcr.io/lakisan1/qp-crm:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
