# Phase 1 (P1-T1) - one-command suite: docker compose run --rm app pytest
[pytest]
# Only tests/ is a suite: the repo root carries legacy scratch scripts
# (test_dests.py, test_pdf_flask.py, test_weasy.py, ...) that must NEVER be
# collected (audit L1).
testpaths = tests

# /app is read-only for the non-root appuser in the image - keep the pytest
# cache out of it.
#
# WHY this key is safe (and must stay): `cache_dir` is REGISTERED by pytest's
# built-in cacheprovider plugin (parser.addini("cache_dir", ...) in
# _pytest/cacheprovider.py). pytest validates ini keys against the plugins
# that actually loaded (post-collection), so the key is only reported as
# "PytestConfigWarning: Unknown config option: cache_dir" when the
# cacheprovider plugin is NOT active in the process -- which happens solely
# when an invocation disables it (`-p no:cacheprovider` in addopts /
# PYTEST_ADDOPTS / the command line; --strict-config then turns the warning
# into an error). The canonical host command and the CI step
# (`docker compose run --rm app pytest`) never disable it, so runs are
# warning-free; the historical warning reproduces only with
# `-p no:cacheprovider` (verified).
#
# Consequences: NEVER add `-p no:cacheprovider` (it also silently drops
# --lf/--ff and the stepwise cache), and NEVER delete cache_dir (appuser
# would then try to create .pytest_cache under root-owned /app and every
# cache write would fail). Both would trade a cosmetic warning for real
# isolation/cache loss.
cache_dir = /tmp/.pytest_cache

addopts = --strict-markers
